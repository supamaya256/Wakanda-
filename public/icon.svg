<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a080c" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E36" />
      <stop offset="100%" stop-color="#B80710" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />

  <!-- Crown Icon -->
  <g transform="translate(156, 80) scale(1.6)" filter="url(#glow)">
    <path d="M10 70 L25 15 L55 50 L85 10 L115 50 L145 15 L160 70 Z" fill="url(#goldGrad)" />
    <circle cx="25" cy="15" r="5" fill="#FFF3A8" />
    <circle cx="85" cy="10" r="6" fill="#FFF3A8" />
    <circle cx="145" cy="15" r="5" fill="#FFF3A8" />
    <rect x="10" y="74" width="150" height="12" rx="4" fill="url(#goldGrad)" />
  </g>

  <!-- DJ Text -->
  <text x="256" y="320" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="url(#redGrad)" letter-spacing="4" filter="url(#glow)">
    DJ EMMA
  </text>

  <!-- PRO FX Text -->
  <text x="256" y="385" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" letter-spacing="8">
    PRO FX
  </text>

  <!-- Subtitle -->
  <text x="256" y="435" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#999999" letter-spacing="3">
    STUDIO • 3D LOGOS
  </text>
</svg>

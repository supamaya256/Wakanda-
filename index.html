    <script>
      // Completely silence and suppress Vite HMR and [vite] console logs and overlay noise
      (function() {
        // 1. Mock Vite HMR WebSocket so browser never attempts connection to non-existent HMR port
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1)) {
              isViteHmr = true;
            }

            if (isViteHmr) {
              var listeners = {};
              var mockSocket = {
                url: url,
                readyState: 1, // OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(handler);
                },
                removeEventListener: function(event, handler) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                },
                dispatchEvent: function() { return true; }
              };
              return mockSocket;
            }

            if (arguments.length > 1 && protocols !== undefined) {
              return new NativeWebSocket(url, protocols);
            }
            return new NativeWebSocket(url);
          };

          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        // 2. Suppress any Vite / WebSocket / offline retry noise in console or errors
        var isViteNoise = function(msg) {
          if (msg === null || msg === undefined) return false;
          var text = '';
          if (typeof msg === 'string') {
            text = msg;
          } else if (msg instanceof Error) {
            text = (msg.message || '') + ' ' + (msg.stack || '');
          } else if (typeof msg === 'object') {
            try {
              text = JSON.stringify(msg) + ' ' + (msg.message || '') + ' ' + (msg.reason || '');
            } catch (e) {
              text = String(msg);
            }
          } else {
            text = String(msg);
          }
          return /\[vite\]|vite:ws|vite-error|websocket|ws:\/\/|wss:\/\/|failed to connect to websocket|Could not reach Cloud Firestore backend|client will operate in offline mode/i.test(text);
        };

        var methods = ['error', 'warn', 'info', 'debug', 'log'];
        for (var m = 0; m < methods.length; m++) {
          (function(method) {
            var orig = console[method];
            if (!orig) return;
            console[method] = function() {
              for (var i = 0; i < arguments.length; i++) {
                if (isViteNoise(arguments[i])) return;
              }
              orig.apply(console, arguments);
            };
          })(methods[m]);
        }

        window.addEventListener('error', function(e) {
          if (isViteNoise(e.message) || isViteNoise(e.filename) || isViteNoise(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteNoise(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
